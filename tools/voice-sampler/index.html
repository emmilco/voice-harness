<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice sampler — voice-harness</title>
<link rel="stylesheet" href="/sampler.css">
</head>
<body>
<main>
  <h1>Voice sampler</h1>
  <p class="lede">Kokoro voices available to voice-harness. Pick a voice, type something, and play it.</p>

  <label for="voice">Voice</label>
  <div class="row">
    <select id="voice"></select>
    <button id="prev" class="secondary" title="Previous voice (↑)">↑</button>
    <button id="next" class="secondary" title="Next voice (↓)">↓</button>
  </div>

  <label for="text">Text</label>
  <textarea id="text" rows="4" maxlength="600">Here we see the attention scores being scaled. Notice these two lines: we divide by the square root of the head size, so the softmax doesn't saturate as the model gets wider.</textarea>

  <div class="row">
    <button id="play">▶ Play</button>
    <button id="all" class="secondary">Play all voices</button>
    <button id="stop" class="secondary" disabled>■ Stop</button>
    <span id="status" class="status"></span>
  </div>

  <audio id="audio" controls></audio>

  <section class="use">
    <div>To use this voice in the harness, add to VS Code settings:</div>
    <div class="row">
      <code id="setting"></code>
      <button id="copy" class="secondary">Copy</button>
    </div>
    <div class="hint">Takes effect when the Voice Harness panel is reopened.</div>
  </section>
</main>
<script src="/sampler.js"></script>
</body>
</html>
